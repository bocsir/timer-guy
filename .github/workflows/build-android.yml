name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  tags:
    - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Check signing mode
        run: |
          if [ -f android/key.properties ]; then
            echo "Building a release-signed APK."
          else
            echo "::warning::No Android signing secrets configured; the APK will be debug-signed."
          fi

      - name: Determine version
        id: version
        run: |
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/timer-guy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: timer-guy-apk
          path: dist/timer-guy.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'android-latest' }}
          name: ${{ github.ref_type == 'tag' && format('Timer Guy {0}', github.ref_name) || 'Latest Android build' }}
          body: |
            Automated Android build from `${{ github.sha }}`.

            - Version: `${{ steps.version.outputs.version }}`
            - Build number: `${{ steps.version.outputs.build_number }}`
          files: dist/timer-guy.apk
          make_latest: true
